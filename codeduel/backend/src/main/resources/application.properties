spring.application.name=CodeDuel
spring.config.import=optional:file:.env[.properties]
server.port=8081
# Database Settings
spring.datasource.url=jdbc:postgresql://localhost:5433/codeduel
spring.datasource.username=postgres
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Judge0 Execution Engine Host
judge0.url=http://localhost:2358

azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}
azure.openai.api-version=${AZURE_OPENAI_API_VERSION:2024-10-21}

# Optional OpenRouter free-tier AI code review
openrouter.endpoint=${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:}
openrouter.http-referer=${OPENROUTER_HTTP_REFERER:}
openrouter.app-title=${OPENROUTER_APP_TITLE:CodeDuel}

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Winner score = execution weight * speed score + AI weight * quality score
codeduel.winner.execution-weight=${CODEDUEL_WINNER_EXECUTION_WEIGHT:0.7}
codeduel.winner.ai-weight=${CODEDUEL_WINNER_AI_WEIGHT:0.3}
codeduel.submission.timeout-seconds=${CODEDUEL_SUBMISSION_TIMEOUT_SECONDS:75}
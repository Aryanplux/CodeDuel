services:
  app-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeduel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    volumes:
      - app-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeduel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?Set JUDGE0_DB_PASSWORD}
    volumes:
      - judge0-pgdata:/var/lib/postgresql/data

  judge0-server:
    image: judge0/judge0:latest
    restart: unless-stopped
    privileged: true
    command: ["bash", "-c", "sudo mkdir -p /box && sudo chmod 1777 /box && exec ./scripts/server"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?Set JUDGE0_DB_PASSWORD}
      POSTGRES_DB: judge0
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      COUNT: "2"
    depends_on:
      - redis
      - judge0-db

  judge0-worker:
    image: judge0/judge0:latest
    restart: unless-stopped
    privileged: true
    command: ["bash", "-c", "sudo mkdir -p /box && sudo chmod 1777 /box && exec ./scripts/workers"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?Set JUDGE0_DB_PASSWORD}
      POSTGRES_DB: judge0
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
      COUNT: "2"
    depends_on:
      - redis
      - judge0-db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://app-db:5432/codeduel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JUDGE0_URL: http://judge0-server:2358
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      APP_CORS_ALLOWED_ORIGINS: https://${DOMAIN_NAME:-codeduel.tech},https://www.${DOMAIN_NAME:-codeduel.tech}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_ENDPOINT: ${OPENROUTER_ENDPOINT:-https://openrouter.ai/api/v1}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-https://codeduel.tech}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-CodeDuel}
      CODEDUEL_SUBMISSION_TIMEOUT_SECONDS: ${CODEDUEL_SUBMISSION_TIMEOUT_SECONDS:-75}
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0-server:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-codeduel.tech}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

volumes:
  app-pgdata:
  redis-data:
  judge0-pgdata:
  caddy-data:
  caddy-config:

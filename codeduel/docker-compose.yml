version: '3.8'

services:
  app-db:
    image: postgres:15-alpine
    container_name: codeduel-app-db
    environment:
      POSTGRES_DB: codeduel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - app-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codeduel-redis
    ports:
      - "6379:6379"

  judge0-db:
    image: postgres:15-alpine
    container_name: codeduel-judge0-db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
    volumes:
      - judge0-pgdata:/var/lib/postgresql/data

  judge0-server:
    image: judge0/judge0:latest
    container_name: codeduel-judge0
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0password
      POSTGRES_DB: judge0
    depends_on:
      - judge0-db
      - redis

volumes:
  app-pgdata:
  judge0-pgdata:
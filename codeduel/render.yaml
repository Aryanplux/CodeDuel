services:
  - type: web
    name: codeduel-backend
    runtime: docker
    dockerfilePath: ./codeduel/backend/Dockerfile
    dockerContext: ./codeduel/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_USERNAME
        value: default
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: "true"
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: JUDGE0_API_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: CODEDUEL_SUBMISSION_TIMEOUT_SECONDS
        value: "75"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
